apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: backups-pg-escala-api, namespace: escala-dev }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: backup-pg-escala-api, namespace: escala-dev }
spec:
  schedule: "0 3 * * *"          # every day at 03:00
  timeZone: "Europe/Lisbon"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app: backup-escala-api }
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - { name: PGHOST, value: pg-escala-api }
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: db-escala-api, key: POSTGRES_USER } }
                - name: PGDATABASE
                  valueFrom: { secretKeyRef: { name: db-escala-api, key: POSTGRES_DB } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: db-escala-api, key: POSTGRES_PASSWORD } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  FILE="/backups/escala-$(date +%Y-%m-%d_%H%M).dump"
                  pg_dump -Fc -f "$FILE"
                  echo "backup written: $FILE"
                  # retention: delete dumps older than 7 days (10080 minutes)
                  find /backups -name '*.dump' -mmin +10080 -delete
                  ls -lh /backups
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: backups, mountPath: /backups }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: backups-pg-escala-api }
