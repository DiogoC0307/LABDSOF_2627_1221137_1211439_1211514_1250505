apiVersion: v1
kind: ConfigMap
metadata: { name: elegibilidade-worker-config, namespace: escala-dev }
data:
  SPRING_PROFILES_ACTIVE: "dev"
  LOGGING_LEVEL_ROOT: "DEBUG"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  # Exchanges and queues come from infra/rabbitmq/definitions.json; this service login may not declare them
  SPRING_RABBITMQ_DYNAMIC: "false"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pg-elegibilidade-worker:5432/elegibilidade"
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
  OTEL_SERVICE_NAME: "elegibilidade-worker"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev"
  LOGGING_PATTERN_LEVEL: "%5p [%X{trace_id:-},%X{span_id:-}]"
