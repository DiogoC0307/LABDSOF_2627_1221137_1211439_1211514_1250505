apiVersion: v1
kind: ConfigMap
metadata: { name: web-nginx, namespace: escala-dev }
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;

      # browser calls /api/... -> escala-api, so no CORS is needed. The /api prefix is kept (the controllers are
      # mapped under /api/v1, as in Docker Compose); only the Actuator is served by the service at /actuator.
      location /api/actuator/ {
        proxy_pass http://escala-api:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /api/ {
        proxy_pass http://escala-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
