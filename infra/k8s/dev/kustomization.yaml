apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shared/namespace.yaml
  - shared/sealed-secret.yaml            # generated by infra/scripts/seal-secrets (.ps1 / .sh)
  - shared/rabbitmq.yaml
  - shared/rabbitmq-config.yaml
  - shared/networkpolicy.yaml
  - escala-api/sealed-secret.yaml        # generated
  - escala-api/postgres.yaml
  - escala-api/sealed-secret-rabbitmq.yaml   # generated
  - escala-api/backup.yaml
  - escala-api/networkpolicy.yaml
  - escala-api/configmap.yaml
  - escala-api/deployment.yaml
  - escala-api/service.yaml
  - escala-api/hpa.yaml
  - elegibilidade-worker/sealed-secret.yaml   # generated
  - elegibilidade-worker/postgres.yaml
  - elegibilidade-worker/sealed-secret-rabbitmq.yaml   # generated
  - elegibilidade-worker/backup.yaml
  - elegibilidade-worker/networkpolicy.yaml
  - elegibilidade-worker/configmap.yaml
  - elegibilidade-worker/deployment.yaml
  - elegibilidade-worker/service.yaml
  - elegibilidade-worker/hpa.yaml
  - web/configmap.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  - web/ingress.yaml
images:
  - { name: ghcr.io/diogoc0307/escala-api, newTag: latest }
  - { name: ghcr.io/diogoc0307/elegibilidade-worker, newTag: latest }
  - { name: ghcr.io/diogoc0307/escala-web, newTag: latest }
