# Prometheus finds the pods of escala-api and elegibilidade-worker through the Kubernetes API (SCRUM-97).
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-discover-pods }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-discover-pods }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-discover-pods }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: observability }
