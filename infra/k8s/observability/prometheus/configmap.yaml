apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: observability }
data:
  prometheus.yml: |
    # One Prometheus for dev, QA and prod (SCRUM-97). It scrapes /actuator/prometheus of escala-api (8080) and
    # elegibilidade-worker (8081) in the three escala-* namespaces, every 30 s, straight from the pods: never through
    # the web proxy, which forwards only /api/actuator/health. The deployments need no annotation.
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: escala
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [escala-dev, escala-qa, escala-prod]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: escala-api|elegibilidade-worker
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080|8081"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
