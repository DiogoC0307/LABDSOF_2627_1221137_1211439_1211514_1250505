apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - tempo/configmap.yaml
  - tempo/pvc.yaml
  - tempo/deployment.yaml
  - tempo/service.yaml
  - loki/configmap.yaml
  - loki/pvc.yaml
  - loki/deployment.yaml
  - loki/service.yaml
  - prometheus/rbac.yaml
  - prometheus/configmap.yaml
  - prometheus/pvc.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - alloy/rbac.yaml
  - alloy/configmap.yaml
  - alloy/deployment.yaml
  - grafana/sealed-secret.yaml
  - grafana/configmap.yaml
  - grafana/dashboard-provider.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - grafana/ingress.yaml
# The Escala dashboards (SCRUM-97), mounted by grafana/deployment.yaml. kustomize reads only files under this folder,
# so grafana/dashboards/ holds a copy of infra/observability/dashboards/; a test (TC-SCRUM-97-10) keeps them equal.
configMapGenerator:
  - name: grafana-dashboards
    namespace: observability
    files:
      - grafana/dashboards/escala-operations.json
    options:
      disableNameSuffixHash: true
