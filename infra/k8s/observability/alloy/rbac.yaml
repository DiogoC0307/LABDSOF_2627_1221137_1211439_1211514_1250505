apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: alloy-read-pod-logs }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: alloy-read-pod-logs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: alloy-read-pod-logs }
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: observability }
