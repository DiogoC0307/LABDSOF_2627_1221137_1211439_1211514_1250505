apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-config, namespace: observability }
data:
  config.alloy: |
    // Alloy reads the logs of every pod in the escala-* namespaces through the Kubernetes API and sends them to Loki.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "escala" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "escala-.*"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "escala" {
      targets    = discovery.relabel.escala.output
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
