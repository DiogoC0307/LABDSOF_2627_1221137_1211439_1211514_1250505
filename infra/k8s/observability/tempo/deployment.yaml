apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo, namespace: observability }
spec:
  replicas: 1
  strategy: { type: Recreate }        # the volume can only be mounted by one pod
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      securityContext: { fsGroup: 10001 }
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          persistentVolumeClaim: { claimName: tempo-data }
