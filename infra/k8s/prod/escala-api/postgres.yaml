# This service's OWN database (escala). No other service connects to it.
apiVersion: v1
kind: Service
metadata: { name: pg-escala-api, namespace: escala-prod }
spec:
  clusterIP: None
  selector: { app: pg-escala-api }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: pg-escala-api, namespace: escala-prod }
spec:
  serviceName: pg-escala-api
  replicas: 1
  selector:
    matchLabels: { app: pg-escala-api }
  template:
    metadata:
      labels: { app: pg-escala-api }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: db-escala-api } }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            exec: { command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: backups, mountPath: /backups, readOnly: true }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: backups-pg-escala-api, readOnly: true }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
