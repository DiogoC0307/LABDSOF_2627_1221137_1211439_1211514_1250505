apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: elegibilidade-worker, namespace: escala-prod }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: elegibilidade-worker }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
