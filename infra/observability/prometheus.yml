# Prometheus for Docker Compose, profile "observability" (SCRUM-97). It scrapes /actuator/prometheus of both services
# every 30 s on the Compose network; the web proxy forwards only /api/actuator/health. In Kubernetes the same
# job is in infra/k8s/observability/prometheus/configmap.yaml, with pod discovery instead of fixed targets.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
scrape_configs:
  - job_name: escala
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["escala-api:8080"]
        labels: { app: escala-api, namespace: local }
      - targets: ["elegibilidade-worker:8081"]
        labels: { app: elegibilidade-worker, namespace: local }
