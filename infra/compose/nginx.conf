# nginx for the web container in compose.yaml (in Kubernetes the same file comes from web/configmap.yaml)
server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's internal DNS; re-resolves escala-api if its container is recreated
  resolver 127.0.0.11 valid=10s;

  # the Actuator is served by escala-api at /actuator, not under /api; this keeps the smoke-test URL
  # https://<host>/api/actuator/health the same here and in Kubernetes (web/configmap.yaml)
  location /api/actuator/ {
    set $api http://escala-api:8080;
    rewrite ^/api/actuator/(.*)$ /actuator/$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # browser calls /api/v1/... on the PWA; forwarded as-is to escala-api
  location /api/ {
    set $api http://escala-api:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
