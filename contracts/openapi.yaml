openapi: 3.0.3
info:
  title: Escala API
  version: 0.1.0
  description: >
    REST contract for escala-api (published roster, unavailability, swaps, cover).
    Authentication is a mocked bearer token carrying memberId and role (ADR 0006).


    Implemented in escala-api today: GET and POST /api/v1/piquetes, GET and PUT /api/v1/piquetes/{id}, the two mocked sign-in endpoints
    under /api/v1/auth, the members and certification types under /api/v1/members and
    /api/v1/certification-types (SCRUM-77), the member's own unavailability under /api/v1/unavailabilities
    (SCRUM-64), the candidate checks under /api/v1/candidate-checks (SCRUM-171), publishing a week under /api/v1/schedule-publications and the member's own notifications
    under /api/v1/notifications (SCRUM-66), and the three Actuator health endpoints under /actuator/health. Every other path
    is the planned product API and does not exist yet; escala-api answers 401 or 403 on it.


    The bearer token is checked on every implemented endpoint except the health and sign-in ones
    (security: [] on those): no token, or a token escala-api does not accept, answers 401; a role the
    access-control matrix on 09 does not allow answers 403 (SCRUM-63).


    Servers and base paths. Paths are the ones escala-api serves. The web nginx forwards /api/ to
    escala-api unchanged, so /api/v1/piquetes is the same path on every server below. The Actuator
    is not under /api in escala-api: through the web nginx it is reached as /api/actuator/..., so the
    health paths declare their own servers.
servers:
  - url: http://localhost:8080
    description: Docker Compose, straight to escala-api
  - url: http://localhost:8000
    description: Docker Compose, through the web nginx
  - url: https://escala-dev.duckdns.org
    description: dev (Kubernetes), through the web nginx
  - url: https://escala-qa.duckdns.org
    description: qa (Kubernetes), through the web nginx
  - url: https://escala-prod.duckdns.org
    description: prod (Kubernetes), through the web nginx
tags:
  - name: health
    description: Actuator health, liveness and readiness of escala-api, without a token
  - name: auth
    description: Mocked sign-in with the seeded users (ADR 0006)
  - name: members
    description: Members with their functions, licences and certifications, and the certification types (SCRUM-77)
  - name: me
    description: The signed-in member's own roster (planned)
  - name: piquetes
    description: Piquetes and their slots
  - name: assignments
    description: Assigning a member to a slot (planned)
  - name: notifications
    description: The signed-in member's own notifications (SCRUM-66)
  - name: unavailabilities
    description: The signed-in member's own unavailability (SCRUM-64)
  - name: swaps
    description: Swaps between members (planned)
  - name: presence
    description: Presence on a slot (planned)
  - name: cover
    description: Cover requests (planned)
  - name: risk
    description: Today's operational risk from IPMA (planned)
paths:
  /me/roster:
    get:
      tags: [me]
      summary: The caller's published shifts
      operationId: getMyRoster
      responses:
        "200":
          description: Own roster
        "401":
          $ref: "#/components/responses/Unauthorized"
  /actuator/health:
    get:
      tags: [health]
      summary: Overall health, including the database and the broker
      description: >
        Spring Boot Actuator, the only endpoint exposed (management.endpoints.web.exposure.include=health,
        details hidden). Answers 503 with status DOWN when the database, RabbitMQ or a listener is down.
        The connection timeouts are 3 s, so it answers within seconds (SCRUM-88). No probe or healthcheck
        uses this path: the Kubernetes probes use the two groups below, and the Docker Compose healthcheck
        of escala-api uses readiness. It is where a broker or listener failure shows, since readiness does
        not include them.
      operationId: getHealth
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Up
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthWithGroups"
              example:
                groups: [liveness, readiness]
                status: UP
        "503":
          description: A dependency is down
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthWithGroups"
              example:
                groups: [liveness, readiness]
                status: DOWN
  /actuator/health/liveness:
    get:
      tags: [health]
      summary: Liveness
      description: >
        The application state only (livenessState): it stays 200 with the database, RabbitMQ or a listener
        down, so a dependency that is down never restarts the pod. The Kubernetes liveness probe (SCRUM-88).
      operationId: getHealthLiveness
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Process is up
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: UP
  /actuator/health/readiness:
    get:
      tags: [health]
      summary: Readiness
      description: >
        readinessState and the database only: 503 within a few seconds when the database is down, so the
        pod leaves the Service. RabbitMQ and the listener containers are not part of it: with the broker
        down or a listener stopped the API keeps serving (events wait in the outbox), readiness stays 200
        and /actuator/health answers 503. The Kubernetes readiness probe (SCRUM-88). The
        elegibilidade-worker's readiness, which has no API, also includes RabbitMQ and the listeners.
      operationId: getHealthReadiness
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Ready to receive traffic
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: UP
  /api/v1/piquetes:
    get:
      tags: [piquetes]
      summary: List piquetes, or the piquetes of one week (SCRUM-45, SCRUM-65)
      description: >
        With week, the piquetes from that week's Monday to its Sunday, in date order (SCRUM-65). Without it,
        all piquetes in the order the database returns them (walking skeleton, SCRUM-45). Any signed-in role
        (MEMBER, SUPERVISOR, ADMIN).
      operationId: listPiquetes
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - name: week
          in: query
          required: false
          description: >
            An ISO 8601 week, YYYY-Www: Monday to Sunday, the week of RN12. Week 1 is the week with the year's first
            Thursday, so 2026-W01 starts on 2025-12-29. A week that does not exist (e.g. 2025-W53) answers 400.
          schema:
            type: string
            pattern: "^\\d{4}-W\\d{2}$"
          example: "2026-W48"
      responses:
        "200":
          description: Piquetes with their slots (an empty array when there are none)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PiqueteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [piquetes]
      summary: Create a piquete (a shift) with a slot for each person its crew needs
      description: >
        A shift the supervisor defines (SCRUM-65, D1): dutyDate, period, startsAt, endsAt and crew, how many
        people of each role it needs. When any of the last four is sent, all are required and checked (400 with
        a code per field): the day is today or later in Lisbon (in_the_past), the shift starts on that day in
        Lisbon (not_on_duty_date), ends after it starts (ends_before_start) and lasts at most 24 hours
        (too_long); crew lists each role at most once (duplicate) with a count of 0 or more (invalid), and its
        counts add up to 1 to 50 (too_small, too_large). The piquete gets one slot per person, in the order
        CREW_CHIEF, DRIVER, CREW_MEMBER, and minimumCrew is their number. A body with only dutyDate still creates
        a piquete with no times and one CREW_MEMBER slot (walking skeleton, SCRUM-45). Every new slot has status
        PENDING; escala-api queues one AvaliacaoPedida per slot and each becomes ELIGIBLE after the worker answers
        (a few seconds). SUPERVISOR only (build the schedule, access-control matrix on 09): MEMBER and ADMIN get
        403 and nothing is created.
      operationId: createPiquete
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiqueteRequest"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: >
                /api/v1/piquetes/{id} of the new piquete; GET /api/v1/piquetes/{id} answers it (SCRUM-88) and
                PUT on it changes the shift (SCRUM-65).
              schema:
                type: string
                example: /api/v1/piquetes/9f6456d9-0df5-46db-9adc-6c412207a4df
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiqueteResponse"
        "400":
          description: Invalid presence request (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: Content-Type is not application/json (Spring Boot error body)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/piquetes/{id}:
    get:
      tags: [piquetes]
      summary: One piquete, the Location of POST /api/v1/piquetes (SCRUM-88)
      description: Any signed-in role.
      operationId: getPiquete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The piquete with its slots
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiqueteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No piquete with that ID (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [piquetes]
      summary: Change a shift's day, period, times and crew (SCRUM-65)
      description: >
        Every field is required and checked as on create (400 with a code per field). A piquete whose day has
        passed in Lisbon cannot change (409), nor can a shift be moved to such a day (400, in_the_past). A role
        that needs more people gets new PENDING slots, each with its AvaliacaoPedida; a role that needs fewer
        loses the slots furthest from being filled (OPEN, then EVALUATION_FAILED, PENDING, ELIGIBLE). A slot
        someone was proposed for or holds (PROPOSED, FILLED) is never removed: a count below their number for its
        role is refused (400, crew below_filled) and nothing changes. The other slots are kept as they are.
        SUPERVISOR only: MEMBER and ADMIN get 403 and nothing changes.
      operationId: updatePiquete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePiqueteRequest"
      responses:
        "200":
          description: The changed piquete
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiqueteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No piquete with that ID (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The piquete's day has passed in Lisbon, so it cannot change here (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mock-users:
    get:
      tags: [auth]
      summary: The users the mocked sign-in offers (SCRUM-63)
      description: >
        The active members, each with ID, name and role only (never a contact). Synthetic users only while
        sign-in is mocked (ADR 0006; 09, T-01).
      operationId: listMockUsers
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The users to pick from
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockUser"
  /api/v1/auth/mock-sign-in:
    post:
      tags: [auth]
      summary: Sign in as one of the mocked users and get their token (SCRUM-63)
      description: >
        No password: the token is issued for any active member (ADR 0006). Send it as
        Authorization: Bearer <token>.
      operationId: mockSignIn
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockSignInRequest"
      responses:
        "200":
          description: Signed in
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockSignInResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Unknown or inactive member. The JSON error body, no token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/members:
    get:
      tags: [members]
      summary: The members with their functions, licences and certifications (SCRUM-77)
      description: SUPERVISOR and ADMIN. The contact is in the answer only for the admin (09).
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Members, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [members]
      summary: Register a member (ADMIN)
      description: >
        A new member always has the access role MEMBER; changing a role waits for audit records (09, T-06).
        Every invalid field is answered at once, with a code and never the value.
      operationId: registerMember
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "201":
          description: Registered
          headers:
            Location:
              description: /api/v1/members/{id} of the new member
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [members]
      summary: One member
      description: >
        SUPERVISOR and ADMIN read any member; a MEMBER reads only themself (403 for anyone else). The contact
        is in the answer only for the admin and the member themself (09).
      operationId: getMember
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [members]
      summary: Change a member's details and functions (ADMIN)
      description: Licences and certifications change through /api/v1/members/{id}/certifications.
      operationId: changeMemberDetails
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDetailsRequest"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/members/{id}/certifications:
    put:
      tags: [members]
      summary: Replace a member's driving licences and certifications (ADMIN)
      description: >
        The lists are what the member holds after the change: a type or class already held is renewed
        (new dates, no history), a new one is added and one not listed is removed. A member or a supervisor
        gets 403 and nothing changes (SCRUM-77 AC5).
      operationId: replaceMemberQualifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationsRequest"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/certification-types:
    get:
      tags: [members]
      summary: The certification types (SUPERVISOR and ADMIN)
      operationId: listCertificationTypes
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: TAS and TAT
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/schedule-publications:
    post:
      tags: [piquetes]
      summary: Publish a week in one action (SCRUM-66)
      description: >
        The supervisor sends every shift of the week on a day that has not passed, as it should be, with who is on
        it. A shift of the week left out is deleted; shifts on days that have passed are never changed nor deleted.
        Each shift is checked as on create (400 with a code per field, the field named after its place, e.g.
        shifts[2].endsAt); an id must be a shift of this week on a day that has not passed (unknown_shift), a key is
        unique in the request, each member exists (unknown_member), is on the shift once, and a role has no more
        members than the shift needs (too_many). Nothing on the schedule changes yet: members still see the week
        as it was. Each member on a shift is then checked by the eligibility rules in elegibilidade-worker
        (AvaliacaoPedida, purpose ASSIGNMENT; ADR 0007), and the answer is 202 with the publication CHECKING. When
        every check is back the week is PUBLISHED (applied as it was checked, and the members notified) or BLOCKED
        with its conflicts (nothing changes). A shift that is short of people is published; one with nobody on it
        is a conflict. A week with nobody to check is published or blocked at once. A publication of the same week
        still CHECKING is SUPERSEDED. SUPERVISOR only: MEMBER and ADMIN get 403.
      operationId: publishWeek
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationRequest"
      responses:
        "202":
          description: Publishing started; follow it at the Location
          headers:
            Location:
              description: /api/v1/schedule-publications/{id} of the publication
              schema:
                type: string
              example: /api/v1/schedule-publications/3b8a9d0e-4f6e-4b7c-9d4e-2a1b0c9e8f7d
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/schedule-publications/{id}:
    get:
      tags: [piquetes]
      summary: A publication and its conflicts, the Location of POST /api/v1/schedule-publications (SCRUM-66)
      description: >
        The PWA asks this until the status is no longer CHECKING. conflicts is empty unless it is BLOCKED.
        SUPERVISOR only.
      operationId: getPublication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The publication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No publication with that ID (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: The signed-in member's own notifications, newest first, at most 50 (SCRUM-66, RF20)
      description: >
        Any signed-in role, only their own. Written when a week is published: the first publication of a week
        tells each member on it how many shifts they have (WEEKLY_SCHEDULE_PUBLISHED); a later one tells only the members
        whose own shifts changed (ADDED_TO_SHIFT, REMOVED_FROM_SHIFT, SHIFT_TIMES_CHANGED, SHIFT_CANCELLED). The
        PWA asks every 30 seconds and writes the text itself.
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The notifications (an empty array when there are none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      summary: Mark all the signed-in member's notifications as read (SCRUM-66)
      description: Any signed-in role, only their own; when they choose "Mark all as read".
      operationId: markNotificationsRead
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "204":
          description: Marked as read
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one of the signed-in member's notifications as read (SCRUM-66)
      description: >
        Any signed-in role, only their own; when they open that notification. Marking one that is already read
        answers 204 too.
      operationId: markNotificationRead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      responses:
        "204":
          description: Marked as read
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The member has no notification with that ID (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assignments:
    post:
      tags: [assignments]
      summary: Propose a member for a slot; 202 and AvaliacaoPedida (purpose ASSIGNMENT)
      operationId: proposeAssignment
      responses:
        "202":
          description: Accepted, evaluation pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/candidate-checks:
    post:
      tags: [assignments]
      summary: Check who can take a role on a shift (SCRUM-171)
      description: >
        The supervisor sends a shift they are building (its start, end and the role) and the other shifts of the
        week as they have them now, with who is on each (RN05). Every member with that function is checked by the
        eligibility rules in elegibilidade-worker (AvaliacaoPedida, purpose CANDIDATE; ADR 0007), and the answer is
        202 with the check CHECKING. The PWA asks GET at the Location until it is DONE, and offers only the members
        found ELIGIBLE. Times required, the end after the start, at most a day (400 with a code per field).
        SUPERVISOR only: MEMBER and ADMIN get 403.
      operationId: startCandidateCheck
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateCheckRequest"
      responses:
        "202":
          description: Checking started; follow it at the Location
          headers:
            Location:
              description: /api/v1/candidate-checks/{id} of the check
              schema:
                type: string
              example: /api/v1/candidate-checks/7c2f1d4a-3b8e-4f5a-9c6d-1e2f3a4b5c6d
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCheck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/candidate-checks/{id}:
    get:
      tags: [assignments]
      summary: A candidate check and the answer for each member, the Location of POST /api/v1/candidate-checks (SCRUM-171)
      description: >
        CHECKING while any member is still PENDING, then DONE. A check with nobody who has the role is DONE in
        the answer to POST, with no candidates, and is not kept. Checks are deleted a day after they are made.
        SUPERVISOR only.
      operationId: getCandidateCheck
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCheck"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No candidate check with that ID, or it was deleted (the JSON error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assignments/{id}/confirm:
    post:
      tags: [assignments]
      summary: Confirm an assignment; refused while no valid eligible evaluation exists
      operationId: confirmAssignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed
        "409":
          description: Confirmation blocked (pending, failed, ineligible, or outdated)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/unavailabilities:
    get:
      tags: [unavailabilities]
      summary: The caller's own unavailability periods ("When I can't", SCRUM-64)
      description: Any role. Only the caller's periods, ordered by start. Dates and times only, never a reason (09).
      operationId: listMyUnavailabilities
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The caller's periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unavailability"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [unavailabilities]
      summary: Declare a period of unavailability by form (SCRUM-64)
      description: >
        Any role, for the caller only: the member comes from the token, never from the body (T-03). Answers in
        under 500 ms (RNF02): it is one insert, with no event. Overlapping periods are kept as they are.
        A period that has already ended (in_the_past) or that starts more than 6 months ahead
        (too_far_ahead, the same limit as on 06) is refused. There is no PUT: a change is DELETE and POST.
        Free text (SCRUM-75) has its own path, /api/v1/unavailability-messages.
      operationId: declareUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnavailabilityRequest"
      responses:
        "201":
          description: Saved
          headers:
            Location:
              description: /api/v1/unavailabilities/{id} of the new period
              schema:
                type: string
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/unavailabilities/team:
    get:
      tags: [unavailabilities]
      summary: Every member's unavailability in a week, to build the schedule (SCRUM-65)
      description: >
        Supervisor only. The periods of any member that overlap the week, from Monday 00:00 in Lisbon to the Tuesday
        after it (so a night shift that starts on Sunday is covered until it ends), ordered by start. Who and when only:
        no ID, no source, never a reason (09).
      operationId: listTeamUnavailabilities
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - name: week
          in: query
          required: true
          description: >
            An ISO 8601 week, YYYY-Www, as for GET /api/v1/piquetes. A missing week or one that does not exist
            answers 400 (invalid_week).
          schema:
            type: string
            pattern: "^\\d{4}-W\\d{2}$"
          example: "2026-W48"
      responses:
        "200":
          description: The periods (an empty array when there are none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamUnavailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/unavailabilities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [unavailabilities]
      summary: One of the caller's periods
      description: A period of another member answers 404, not 403, so its existence is not revealed.
      operationId: getMyUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No period with that ID for the caller (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [unavailabilities]
      summary: Remove one of the caller's periods
      description: A period of another member answers 404 and nothing changes.
      operationId: deleteMyUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No period with that ID for the caller (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/unavailability-messages:
    post:
      tags: [unavailabilities]
      summary: Say when the caller cannot serve, in their own words (SCRUM-75)
      description: >
        Any role, for themself. Answers 202 at once: the text goes to elegibilidade-worker as ExtracaoPedida
        through the outbox, with the reference date (today in Lisbon) and never the member. Nothing counts as
        unavailability until the member confirms the proposal. The free text is deleted on confirmation, on
        discard, or 24 hours after the message (RNF09, 09); it is never logged nor returned. At most 10 messages
        per member in any hour (09 T-11): the 11th answers 429. With AI off (AI_ENABLED, ADR 0011) the text is
        not taken and the answer is 409 ai_off; the PWA asks GET /api/v1/unavailability-messages/settings first
        and then shows only the form (SCRUM-89).
      operationId: sendUnavailabilityMessage
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnavailabilityMessageRequest"
      responses:
        "202":
          description: Accepted; the proposal follows in the message (status PENDING until the worker answers)
          headers:
            Location:
              description: /api/v1/unavailability-messages/{id}
              schema:
                type: string
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailabilityMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            AI is off (SCRUM-89): nothing is stored. Spring Boot's error fields and errors
            [{field: text, code: ai_off}].
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: More than 10 messages within an hour
          headers:
            Retry-After:
              description: Seconds until the oldest message of the hour leaves the window
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/unavailability-messages/settings:
    get:
      tags: [unavailabilities]
      summary: Whether the free text is read automatically (SCRUM-89)
      description: >
        Any role. aiEnabled follows AI_ENABLED, the same flag as elegibilidade-worker's (ADR 0011): when it is
        false the PWA shows only the form and POST /api/v1/unavailability-messages answers 409 ai_off. A literal
        path: "settings" is never read as a message ID.
      operationId: getUnavailabilityMessageSettings
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The setting
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailabilityMessageSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/unavailability-messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [unavailabilities]
      summary: One of the caller's messages, with the proposal once it arrives
      description: >
        PENDING until ExtracaoConcluida arrives, then PROPOSED with the periods read (maybe none: the PWA then
        suggests the form). A message of another member answers 404.
      operationId: getMyUnavailabilityMessage
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The message, without the free text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailabilityMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No message with that ID for the caller (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [unavailabilities]
      summary: Discard one of the caller's messages
      description: >
        The free text and its outbox row are deleted and the proposal is not used. 204 also when the message was
        already closed; another member's answers 404.
      operationId: discardMyUnavailabilityMessage
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "204":
          description: Discarded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No message with that ID for the caller (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/unavailability-messages/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [unavailabilities]
      summary: Confirm the periods, as the member edited them
      description: >
        The periods are patterns in Lisbon time (the format of ExtracaoConcluida v2). escala-api expands them
        into continuous periods in UTC and saves them as unavailability with source FREE_TEXT; whole days in a
        row become one period and overlapping ones are joined. In the same transaction the free text is deleted
        (AC4). A period that has ended, or that starts or ends more than 6 months after today, rejects the whole
        confirmation; a period running now keeps only the days that have not ended. At most 10 periods.
      operationId: confirmMyUnavailabilityMessage
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periods]
              properties:
                periods:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: "#/components/schemas/ProposedPeriod"
      responses:
        "200":
          description: The periods saved, in UTC, ordered by start
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unavailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No message with that ID for the caller (Spring Boot error body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No proposal yet, or the message is already confirmed, discarded or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /swaps:
    post:
      tags: [swaps]
      summary: Request a swap with a named colleague
      operationId: requestSwap
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
  /swaps/{id}/accept:
    post:
      tags: [swaps]
      summary: Counterpart accepts; 202 and AvaliacaoPedida (purpose SWAP)
      operationId: acceptSwap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Accepted, check pending
        "409":
          description: Check failed or approval required
        "401":
          $ref: "#/components/responses/Unauthorized"
  /swaps/{id}/approve:
    post:
      tags: [swaps]
      summary: Supervisor approval when the corps requires it (D-01 / RN11)
      operationId: approveSwap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/slots/{id}/presence:
    post:
      tags: [presence]
      summary: Confirm coming or cannot, 24 h before the shift (configurable advance, SCRUM-70)
      operationId: confirmPresence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [COMING, CANNOT_COME]
      responses:
        "202":
          description: Recorded; CANNOT_COME frees the slot
          content:
            application/json:
              schema:
                type: object
                required: [slotId, presenceStatus, slotStatus, slotFreed]
                properties:
                  slotId:
                    type: string
                    format: uuid
                  presenceStatus:
                    type: string
                    enum: [UNCONFIRMED, COMING, CANNOT_COME]
                  slotStatus:
                    type: string
                    enum: [OPEN, PENDING, ELIGIBLE, PROPOSED, FILLED, EVALUATION_FAILED]
                  slotFreed:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cover-requests/{id}/accept:
    post:
      tags: [cover]
      summary: First free and qualified accept; 202 and AvaliacaoPedida (purpose COVER)
      operationId: acceptCover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Accepted, check pending
        "409":
          description: Slot already filled or check ineligible
        "401":
          $ref: "#/components/responses/Unauthorized"
  /risk/today:
    get:
      tags: [risk]
      summary: Observed RCM for today, age, and assumed-higher display warning
      operationId: getTodayRisk
      responses:
        "200":
          description: Risk read model
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Mocked token from POST /api/v1/auth/mock-sign-in (ADR 0006): "mock." followed by the base64url of
        {"memberId": "...", "role": "..."}. It is not signed: escala-api accepts it only for an active member
        whose role in the database is the role in the token, and answers 401 otherwise. Anyone can build the
        token of a seeded user, the same exposure as the mocked sign-in itself (09, T-01).
  responses:
    Unauthorized:
      description: No token, or a token escala-api does not accept (Spring Boot error body)
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The role is not allowed (Spring Boot error body)
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: >
        Every 400 of the API has this body (SCRUM-88): Spring Boot's error fields and errors, each with the
        field and a code, never the value. A value Jackson cannot read (a date, an enum value) gives the field
        and invalid; no body or a body that is not JSON gives body and not_readable; a path parameter of the
        wrong type gives the parameter and invalid. Always JSON, whatever the Accept header.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    NotFound:
      description: No member with that ID (Spring Boot error body)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >
        Correlation id. escala-api uses the value sent, or creates a UUID when the header is absent or
        blank, and returns it in the same header on every response, errors included. It travels in
        the AvaliacaoPedida event and comes back in AvaliacaoConcluida.
      schema:
        type: string
  headers:
    TraceId:
      description: The trace id of the request (the one sent, or a generated UUID)
      schema:
        type: string
        example: d26598d5-750d-4276-b097-f629d6eef444
  schemas:
    AccessRole:
      type: string
      description: What a member may do (ADR 0006; access-control matrix on 09). Not the member's rank.
      enum: [MEMBER, SUPERVISOR, ADMIN]
    MockUser:
      type: object
      required: [id, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Synthetic Supervisor
        role:
          $ref: "#/components/schemas/AccessRole"
    MockSignInRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000002
    MockSignInResponse:
      type: object
      required: [token, memberId, role, fullName]
      properties:
        token:
          type: string
          example: mock.eyJtZW1iZXJJZCI6IjAwMDAwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMiIsInJvbGUiOiJTVVBFUlZJU09SIn0
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AccessRole"
        fullName:
          type: string
    ShiftPeriod:
      type: string
      description: The period of a shift, chosen by the supervisor (SCRUM-65, D1)
      enum: [DAY, NIGHT]
    CreatePiqueteRequest:
      type: object
      required: [dutyDate]
      description: >
        With period, startsAt, endsAt or crew, all five fields are required (as in UpdatePiqueteRequest).
        With only dutyDate, a piquete with no times (walking skeleton).
      properties:
        dutyDate:
          type: string
          format: date
          example: "2026-12-01"
        period:
          $ref: "#/components/schemas/ShiftPeriod"
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 with an offset or Z; on dutyDate in Europe/Lisbon.
          example: "2026-12-01T08:00:00Z"
        endsAt:
          type: string
          format: date-time
          description: Exclusive; after startsAt and at most 24 hours later. A night shift ends the next day.
          example: "2026-12-01T20:00:00Z"
        crew:
          $ref: "#/components/schemas/Crew"
    UpdatePiqueteRequest:
      type: object
      required: [dutyDate, period, startsAt, endsAt, crew]
      properties:
        dutyDate:
          type: string
          format: date
          example: "2026-12-01"
        period:
          $ref: "#/components/schemas/ShiftPeriod"
        startsAt:
          type: string
          format: date-time
          example: "2026-12-01T20:00:00Z"
        endsAt:
          type: string
          format: date-time
          example: "2026-12-02T08:00:00Z"
        crew:
          $ref: "#/components/schemas/Crew"
    Crew:
      type: array
      description: >
        How many people of each role the shift needs (SCRUM-65): each role at most once; a role left out needs
        nobody. The counts add up to 1 to 50.
      minItems: 1
      items:
        $ref: "#/components/schemas/CrewNeed"
      example:
        - role: CREW_CHIEF
          count: 1
        - role: DRIVER
          count: 1
        - role: CREW_MEMBER
          count: 3
    CrewNeed:
      type: object
      required: [role, count]
      properties:
        role:
          $ref: "#/components/schemas/SlotRole"
        count:
          type: integer
          minimum: 0
          maximum: 50
    PiqueteResponse:
      type: object
      required: [id, dutyDate, slots]
      properties:
        id:
          type: string
          format: uuid
        dutyDate:
          type: string
          format: date
        period:
          type: string
          nullable: true
          enum: [DAY, NIGHT]
          description: The ShiftPeriod of the shift; null on a piquete created without shift times
        startsAt:
          type: string
          format: date-time
          nullable: true
          description: In UTC (ADR 0012); null on a piquete created without shift times
        endsAt:
          type: string
          format: date-time
          nullable: true
        minimumCrew:
          type: integer
          nullable: true
          description: The number of people the crew needs (the sum of its counts); null on a piquete without times
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotResponse"
    SlotResponse:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SlotRole"
        status:
          $ref: "#/components/schemas/SlotStatus"
        memberId:
          type: string
          format: uuid
          nullable: true
          description: Who holds the slot once its week is published (SCRUM-66); null when nobody does
    PublicationRequest:
      type: object
      required: [week, shifts]
      properties:
        week:
          type: string
          pattern: "^\\d{4}-W\\d{2}$"
          example: "2026-W49"
        shifts:
          type: array
          description: Every shift of the week on a day that has not passed
          items:
            $ref: "#/components/schemas/PublishedShift"
    PublishedShift:
      type: object
      required: [key, dutyDate, period, startsAt, endsAt, crew, assigned]
      properties:
        key:
          type: string
          description: The supervisor's own name for the shift, unique in the request, given back on each conflict
          example: new-1
        id:
          type: string
          format: uuid
          nullable: true
          description: The shift to change; null or left out for a new one
        dutyDate:
          type: string
          format: date
        period:
          $ref: "#/components/schemas/ShiftPeriod"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        crew:
          $ref: "#/components/schemas/Crew"
        assigned:
          type: array
          items:
            $ref: "#/components/schemas/AssignedMember"
    AssignedMember:
      type: object
      required: [role, memberId]
      properties:
        role:
          $ref: "#/components/schemas/SlotRole"
        memberId:
          type: string
          format: uuid
    Publication:
      type: object
      required: [id, week, status, conflicts]
      properties:
        id:
          type: string
          format: uuid
        week:
          type: string
          example: "2026-W49"
        status:
          type: string
          description: >
            CHECKING while the members on it are checked; PUBLISHED (members see it and were notified); BLOCKED
            (nothing changed, see conflicts); SUPERSEDED by a later publication of the same week.
          enum: [CHECKING, PUBLISHED, BLOCKED, SUPERSEDED]
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/PublicationConflict"
    PublicationConflict:
      type: object
      required: [type, shiftKey, shiftId, dutyDate]
      description: >
        Why the week cannot be published. EMPTY_SHIFT, a shift with nobody on it (memberId, role and rules are
        null); INELIGIBLE, the eligibility rules refused a member (rules has the codes: RN01 not on the active
        roster, RN05 on another shift at the same time, RN06 said they can't come); NOT_CHECKED, the member could
        not be checked after the retries (publishing again checks them again).
      properties:
        type:
          type: string
          enum: [EMPTY_SHIFT, INELIGIBLE, NOT_CHECKED]
        shiftKey:
          type: string
        shiftId:
          type: string
          format: uuid
        dutyDate:
          type: string
          format: date
        memberId:
          type: string
          format: uuid
          nullable: true
        role:
          type: string
          nullable: true
          enum: [CREW_CHIEF, DRIVER, CREW_MEMBER, null]
        rules:
          type: array
          nullable: true
          items:
            type: string
            enum: [RN01, RN05, RN06]
    Notification:
      type: object
      required: [id, type, week, createdAt, read]
      description: >
        About the member's own shifts only; the PWA writes the text. shiftId and the times are null on
        WEEKLY_SCHEDULE_PUBLISHED; previousStartsAt and previousEndsAt are set only on SHIFT_TIMES_CHANGED, shiftCount only on
        WEEKLY_SCHEDULE_PUBLISHED.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [WEEKLY_SCHEDULE_PUBLISHED, ADDED_TO_SHIFT, REMOVED_FROM_SHIFT, SHIFT_TIMES_CHANGED, SHIFT_CANCELLED]
        week:
          type: string
          example: "2026-W49"
        shiftId:
          type: string
          format: uuid
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        previousStartsAt:
          type: string
          format: date-time
          nullable: true
        previousEndsAt:
          type: string
          format: date-time
          nullable: true
        shiftCount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    CandidateCheckRequest:
      type: object
      required: [startsAt, endsAt, role]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/SlotRole"
        otherShifts:
          type: array
          description: The other shifts of the week in the supervisor's draft, one entry per member on each
          items:
            type: object
            required: [memberId, startsAt, endsAt]
            properties:
              memberId:
                type: string
                format: uuid
              startsAt:
                type: string
                format: date-time
              endsAt:
                type: string
                format: date-time
    CandidateCheck:
      type: object
      required: [id, status, candidates]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CHECKING, DONE]
        candidates:
          type: array
          description: One entry per member with the role
          items:
            type: object
            required: [memberId, result, rules]
            properties:
              memberId:
                type: string
                format: uuid
              result:
                type: string
                description: >
                  PENDING until the worker answers; INELIGIBLE with the codes of the rules broken (RN01 not on the
                  active roster, RN05 on another shift at the same time, RN06 said they can't come); NOT_CHECKED when
                  the worker could not evaluate them after its retries.
                enum: [PENDING, ELIGIBLE, INELIGIBLE, NOT_CHECKED]
              rules:
                type: array
                items:
                  type: string
                  enum: [RN01, RN05, RN06]
    SlotRole:
      type: string
      description: >
        SlotRole in escala-api. A shift has one slot per person of its crew; a walking-skeleton piquete has one,
        CREW_MEMBER.
      enum: [CREW_CHIEF, DRIVER, CREW_MEMBER]
    SlotStatus:
      type: string
      description: >
        SlotStatus in escala-api. A new slot is PENDING and becomes ELIGIBLE after the evaluation. It becomes
        EVALUATION_FAILED when the evaluation could not be made or applied after the retries (RF24). A failed
        evaluation never makes a slot ELIGIBLE; an operator resolves it by replaying the dead-letter queue, and
        the ELIGIBLE result of the replayed evaluation then makes the slot ELIGIBLE.
        escala-api sets no other value yet.
      enum: [OPEN, PENDING, ELIGIBLE, PROPOSED, FILLED, EVALUATION_FAILED]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: UP or DOWN, the values seen in tests
          example: UP
    HealthWithGroups:
      allOf:
        - $ref: "#/components/schemas/Health"
        - type: object
          properties:
            groups:
              type: array
              items:
                type: string
              example: [liveness, readiness]
    Rank:
      type: string
      description: Career category; it grants no permission (see AccessRole).
      enum: [CADET, TRAINEE, FIREFIGHTER_3RD_CLASS, FIREFIGHTER_2ND_CLASS, FIREFIGHTER_1ST_CLASS, SUB_CHIEF, CHIEF, OFFICER, COMMANDER]
    RosterStatus:
      type: string
      description: Only the active roster can be scheduled (RN01, checked by the eligibility rules).
      enum: [COMMAND_ROSTER, ACTIVE_ROSTER, RESERVE_ROSTER, HONORARY_ROSTER]
    ServiceFunction:
      type: string
      description: A function a member can take on a slot (the slot roles).
      enum: [CREW_CHIEF, DRIVER, CREW_MEMBER]
    LicenceClass:
      type: string
      enum: [B, C1, C, C1E, CE]
    Licence:
      type: object
      required: [licenceClass, expiresOn]
      properties:
        licenceClass:
          $ref: "#/components/schemas/LicenceClass"
        expiresOn:
          type: string
          format: date
    CertificationRequest:
      type: object
      required: [type, issuedOn, expiresOn]
      properties:
        type:
          type: string
          description: A code from /api/v1/certification-types
          example: TAS
        issuedOn:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
          description: Not before issuedOn (code expires_before_issued)
    Certification:
      allOf:
        - $ref: "#/components/schemas/CertificationRequest"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              example: Tripulante de Ambulância de Socorro
    CertificationType:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: TAS
        name:
          type: string
          example: Tripulante de Ambulância de Socorro
    MemberDetailsRequest:
      type: object
      required: [fullName, rank, rosterStatus, withinAgeLimit, functions]
      properties:
        fullName:
          type: string
          maxLength: 120
        rank:
          $ref: "#/components/schemas/Rank"
        rosterStatus:
          $ref: "#/components/schemas/RosterStatus"
        withinAgeLimit:
          type: boolean
          description: Stored as yes or no; no date of birth (09)
        contact:
          type: string
          nullable: true
          maxLength: 120
          description: Optional. Seen only by the admin and the member themself; never logged (09).
        functions:
          type: array
          description: DRIVER needs at least one driving licence (code driver_without_licence)
          items:
            $ref: "#/components/schemas/ServiceFunction"
    QualificationsRequest:
      type: object
      required: [licences, certifications]
      properties:
        licences:
          type: array
          description: One per class (code duplicate)
          items:
            $ref: "#/components/schemas/Licence"
        certifications:
          type: array
          description: One per type (code duplicate)
          items:
            $ref: "#/components/schemas/CertificationRequest"
    MemberRequest:
      allOf:
        - $ref: "#/components/schemas/MemberDetailsRequest"
        - $ref: "#/components/schemas/QualificationsRequest"
    Member:
      type: object
      required: [id, fullName, accessRole, active, rosterStatus, withinAgeLimit, functions, licences, certifications]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        accessRole:
          $ref: "#/components/schemas/AccessRole"
        active:
          type: boolean
        rank:
          $ref: "#/components/schemas/Rank"
        rosterStatus:
          $ref: "#/components/schemas/RosterStatus"
        withinAgeLimit:
          type: boolean
        contact:
          type: string
          description: Only in answers to the admin and to the member themself; absent otherwise.
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ServiceFunction"
        licences:
          type: array
          items:
            $ref: "#/components/schemas/Licence"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    example: certifications[0].expiresOn
                  code:
                    type: string
                    enum: [required, invalid, invalid_week, not_readable, too_long, expires_before_issued, unknown_certification_type, duplicate, driver_without_licence, ends_before_start, in_the_past, too_far_ahead, no_days, too_many, ai_off, not_on_duty_date, too_small, too_large, below_filled, not_in_week, unknown_shift, unknown_member]
    UnavailabilityRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 with an offset or Z. A day without a time starts at 00:00 in Europe/Lisbon (the PWA sends it so).
          example: "2026-12-05T00:00:00Z"
        endsAt:
          type: string
          format: date-time
          description: Exclusive, after startsAt (code ends_before_start). A whole day ends at 00:00 of the next day, in Lisbon.
          example: "2026-12-08T00:00:00Z"
    Unavailability:
      type: object
      required: [id, startsAt, endsAt, source]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: In UTC (ADR 0012)
        endsAt:
          type: string
          format: date-time
          description: In UTC, exclusive. Deleted 30 days after it (09).
        source:
          type: string
          enum: [FORM, FREE_TEXT]
          description: FREE_TEXT when confirmed from a message (SCRUM-75)
    TeamUnavailability:
      type: object
      required: [memberId, startsAt, endsAt]
      properties:
        memberId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: In UTC (ADR 0012)
        endsAt:
          type: string
          format: date-time
          description: In UTC, exclusive
    UnavailabilityMessageSettings:
      type: object
      required: [aiEnabled]
      properties:
        aiEnabled:
          type: boolean
          description: False when AI_ENABLED is off; the PWA then shows only the form.
    UnavailabilityMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500
          description: In the member's words. Empty gives required, more than 500 characters too_long.
          example: não posso sábado de manhã
    UnavailabilityMessage:
      type: object
      required: [id, status, referenceDate, periods]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, PROPOSED, CONFIRMED, DISCARDED, EXPIRED]
        referenceDate:
          type: string
          format: date
          description: The day the message was sent, in Lisbon; the worker reads relative dates from it
        method:
          type: string
          nullable: true
          enum: [MODEL, BASELINE, FALLBACK]
          description: How the proposal was made (ExtracaoConcluida); null while PENDING
        periods:
          type: array
          description: The proposal; empty while PENDING, or when nothing usable was read
          items:
            $ref: "#/components/schemas/ProposedPeriod"
    ProposedPeriod:
      type: object
      description: >
        The format of ExtracaoConcluida v2 (06): startDate to endDate inclusive, optionally only some weekdays,
        optionally from startTime to endTime in Europe/Lisbon on each day (an end before the start crosses
        midnight; both or neither).
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        weekdays:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      example:
        startDate: "2026-11-28"
        endDate: "2026-11-28"
        startTime: "08:00"
        endTime: "13:00"
    ErrorResponse:
      type: object
      description: >
        Spring Boot's error body, for every error of the API (400 adds errors). Always JSON, whatever the
        Accept header: there is no HTML error page (SCRUM-88).
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        path:
          type: string
security:
  - bearerAuth: []