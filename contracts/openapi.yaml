openapi: 3.0.3
info:
  title: Escala API
  version: 0.1.0
  description: >
    REST contract for escala-api (published roster, unavailability, swaps, cover).
    Authentication is a mocked bearer token carrying memberId and role (ADR 0006).


    Implemented in escala-api today: GET and POST /api/v1/piquetes, the two mocked sign-in endpoints
    under /api/v1/auth, the members and certification types under /api/v1/members and
    /api/v1/certification-types (SCRUM-77), the member's own unavailability under /api/v1/unavailabilities
    (SCRUM-64), and the three Actuator health endpoints under /actuator/health. Every other path
    is the planned product API and does not exist yet; escala-api answers 401 or 403 on it.


    The bearer token is checked on every implemented endpoint except the health and sign-in ones
    (security: [] on those): no token, or a token escala-api does not accept, answers 401; a role the
    access-control matrix on 09 does not allow answers 403 (SCRUM-63).


    Servers and base paths. Paths are the ones escala-api serves. The web nginx forwards /api/ to
    escala-api unchanged, so /api/v1/piquetes is the same path on every server below. The Actuator
    is not under /api in escala-api: through the web nginx it is reached as /api/actuator/..., so the
    health paths declare their own servers.
servers:
  - url: http://localhost:8080
    description: Docker Compose, straight to escala-api
  - url: http://localhost:8000
    description: Docker Compose, through the web nginx
  - url: https://escala-dev.duckdns.org
    description: dev (Kubernetes), through the web nginx
  - url: https://escala-qa.duckdns.org
    description: qa (Kubernetes), through the web nginx
  - url: https://escala-prod.duckdns.org
    description: prod (Kubernetes), through the web nginx
tags:
  - name: health
    description: Actuator health, liveness and readiness of escala-api, without a token
  - name: auth
    description: Mocked sign-in with the seeded users (ADR 0006)
  - name: members
    description: Members with their functions, licences and certifications, and the certification types (SCRUM-77)
  - name: me
    description: The signed-in member's own roster (planned)
  - name: piquetes
    description: Piquetes and their slots
  - name: assignments
    description: Assigning a member to a slot (planned)
  - name: unavailabilities
    description: The signed-in member's own unavailability (SCRUM-64)
  - name: swaps
    description: Swaps between members (planned)
  - name: presence
    description: Presence on a slot (planned)
  - name: cover
    description: Cover requests (planned)
  - name: risk
    description: Today's operational risk from IPMA (planned)
paths:
  /me/roster:
    get:
      tags: [me]
      summary: The caller's published shifts
      operationId: getMyRoster
      responses:
        "200":
          description: Own roster
        "401":
          description: Missing or invalid token
  /actuator/health:
    get:
      tags: [health]
      summary: Overall health, including the database and the broker
      description: >
        Spring Boot Actuator, the only endpoint exposed (management.endpoints.web.exposure.include=health,
        details hidden). Answers 503 with status DOWN when a dependency is down: checked locally with
        RabbitMQ stopped. With the database stopped the request did not answer within 10 seconds.
        The Kubernetes probes and the Docker Compose healthchecks use this path.
      operationId: getHealth
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Up
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthWithGroups"
              example:
                groups: [liveness, readiness]
                status: UP
        "503":
          description: A dependency is down
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthWithGroups"
              example:
                groups: [liveness, readiness]
                status: DOWN
  /actuator/health/liveness:
    get:
      tags: [health]
      summary: Liveness
      description: >
        The application state only. It stayed 200 with RabbitMQ and the database stopped (checked locally).
      operationId: getHealthLiveness
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Process is up
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: UP
  /actuator/health/readiness:
    get:
      tags: [health]
      summary: Readiness
      description: >
        The application state only; no database or broker indicator is configured in it. It stayed 200
        with RabbitMQ and the database stopped (checked locally), so it does not tell whether the
        dependencies are reachable: use /actuator/health for that.
      operationId: getHealthReadiness
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      servers:
        - url: http://localhost:8080
          description: Docker Compose, straight to escala-api (path /actuator/...)
        - url: http://localhost:8000/api
          description: Docker Compose, through the web nginx (path /api/actuator/...)
        - url: https://escala-dev.duckdns.org/api
          description: dev, through the web nginx
        - url: https://escala-qa.duckdns.org/api
          description: qa, through the web nginx
        - url: https://escala-prod.duckdns.org/api
          description: prod, through the web nginx
      responses:
        "200":
          description: Ready to receive traffic
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: UP
  /api/v1/piquetes:
    get:
      tags: [piquetes]
      summary: List piquetes (walking skeleton, SCRUM-45)
      description: >
        All piquetes with their slots, in the order the database returns them. Any signed-in role
        (MEMBER, SUPERVISOR, ADMIN).
      operationId: listPiquetes
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Piquetes with their slots (an empty array when there are none)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PiqueteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [piquetes]
      summary: Create a piquete for a date with one slot
      description: >
        The new slot has role CREW_MEMBER and status PENDING; escala-api queues AvaliacaoPedida and the
        slot becomes ELIGIBLE after the worker answers (a few seconds). Fields other than dutyDate are
        ignored. SUPERVISOR only (build the schedule, access-control matrix on 09): MEMBER and ADMIN get
        403 and nothing is created.
      operationId: createPiquete
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePiqueteRequest"
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: >
                /api/v1/piquetes/{id} of the new piquete. There is no endpoint for that path yet:
                a GET on it answers 404.
              schema:
                type: string
                example: /api/v1/piquetes/9f6456d9-0df5-46db-9adc-6c412207a4df
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiqueteResponse"
        "400":
          description: >
            dutyDate missing or null (empty body), or the body is absent, not valid JSON or dutyDate is not
            a date (Spring Boot error body)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          description: Content-Type is not application/json (Spring Boot error body)
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mock-users:
    get:
      tags: [auth]
      summary: The users the mocked sign-in offers (SCRUM-63)
      description: >
        The active members, each with ID, name and role only (never a contact). Synthetic users only while
        sign-in is mocked (ADR 0006; 09, T-01).
      operationId: listMockUsers
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The users to pick from
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MockUser"
  /api/v1/auth/mock-sign-in:
    post:
      tags: [auth]
      summary: Sign in as one of the mocked users and get their token (SCRUM-63)
      description: >
        No password: the token is issued for any active member (ADR 0006). Send it as
        Authorization: Bearer <token>.
      operationId: mockSignIn
      security: []
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockSignInRequest"
      responses:
        "200":
          description: Signed in
          headers:
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockSignInResponse"
        "400":
          description: memberId missing, or the body is not valid JSON or memberId is not a UUID
        "401":
          description: Unknown or inactive member. No body, no token.
  /api/v1/members:
    get:
      tags: [members]
      summary: The members with their functions, licences and certifications (SCRUM-77)
      description: SUPERVISOR and ADMIN. The contact is in the answer only for the admin (09).
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Members, ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [members]
      summary: Register a member (ADMIN)
      description: >
        A new member always has the access role MEMBER; changing a role waits for audit records (09, T-06).
        Every invalid field is answered at once, with a code and never the value.
      operationId: registerMember
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "201":
          description: Registered
          headers:
            Location:
              description: /api/v1/members/{id} of the new member
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [members]
      summary: One member
      description: >
        SUPERVISOR and ADMIN read any member; a MEMBER reads only themself (403 for anyone else). The contact
        is in the answer only for the admin and the member themself (09).
      operationId: getMember
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [members]
      summary: Change a member's details and functions (ADMIN)
      description: Licences and certifications change through /api/v1/members/{id}/certifications.
      operationId: changeMemberDetails
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberDetailsRequest"
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/members/{id}/certifications:
    put:
      tags: [members]
      summary: Replace a member's driving licences and certifications (ADMIN)
      description: >
        The lists are what the member holds after the change: a type or class already held is renewed
        (new dates, no history), a new one is added and one not listed is removed. A member or a supervisor
        gets 403 and nothing changes (SCRUM-77 AC5).
      operationId: replaceMemberQualifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationsRequest"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/certification-types:
    get:
      tags: [members]
      summary: The certification types (SUPERVISOR and ADMIN)
      operationId: listCertificationTypes
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: TAS and TAT
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /piquetes/{id}/publish:
    post:
      tags: [piquetes]
      summary: Publish the schedule and notify members of their shifts
      operationId: publishPiquete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published
        "401":
          description: Missing or invalid token
        "403":
          description: Role not allowed
  /assignments:
    post:
      tags: [assignments]
      summary: Propose a member for a slot; 202 and AvaliacaoPedida (purpose ASSIGNMENT)
      operationId: proposeAssignment
      responses:
        "202":
          description: Accepted, evaluation pending
        "401":
          description: Missing or invalid token
        "403":
          description: Role not allowed
  /slots/{id}/candidates:
    get:
      tags: [assignments]
      summary: Eligible and ineligible candidates with rule codes
      operationId: listSlotCandidates
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Candidate list
        "401":
          description: Missing or invalid token
        "403":
          description: Role not allowed
  /assignments/{id}/confirm:
    post:
      tags: [assignments]
      summary: Confirm an assignment; refused while no valid eligible evaluation exists
      operationId: confirmAssignment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Confirmed
        "409":
          description: Confirmation blocked (pending, failed, ineligible, or outdated)
        "401":
          description: Missing or invalid token
        "403":
          description: Role not allowed
  /api/v1/unavailabilities:
    get:
      tags: [unavailabilities]
      summary: The caller's own unavailability periods ("When I can't", SCRUM-64)
      description: Any role. Only the caller's periods, ordered by start. Dates and times only, never a reason (09).
      operationId: listMyUnavailabilities
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The caller's periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unavailability"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [unavailabilities]
      summary: Declare a period of unavailability by form (SCRUM-64)
      description: >
        Any role, for the caller only: the member comes from the token, never from the body (T-03). Answers in
        under 500 ms (RNF02): it is one insert, with no event. Overlapping periods are kept as they are.
        A period that has already ended (in_the_past) or that starts more than 6 months ahead
        (too_far_ahead, the same limit as on 06) is refused. There is no PUT: a change is DELETE and POST.
        Free text (SCRUM-75) has its own path, /api/v1/unavailability-messages.
      operationId: declareUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnavailabilityRequest"
      responses:
        "201":
          description: Saved
          headers:
            Location:
              description: /api/v1/unavailabilities/{id} of the new period
              schema:
                type: string
            X-Trace-Id:
              $ref: "#/components/headers/TraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailability"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/unavailabilities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [unavailabilities]
      summary: One of the caller's periods
      description: A period of another member answers 404, not 403, so its existence is not revealed.
      operationId: getMyUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: The period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unavailability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No period with that ID for the caller (no body)
    delete:
      tags: [unavailabilities]
      summary: Remove one of the caller's periods
      description: A period of another member answers 404 and nothing changes.
      operationId: deleteMyUnavailability
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No period with that ID for the caller (no body)
  /api/v1/unavailability-messages:
    post:
      tags: [unavailabilities]
      summary: Declare unavailability in free text, read automatically (planned, SCRUM-75)
      description: >
        Not implemented yet. 202 without waiting for the extraction; the member confirms the proposed periods
        before they count (06).
      operationId: declareUnavailabilityMessage
      responses:
        "202":
          description: Accepted
        "401":
          description: Missing or invalid token
  /swaps:
    post:
      tags: [swaps]
      summary: Request a swap with a named colleague
      operationId: requestSwap
      responses:
        "201":
          description: Created
        "401":
          description: Missing or invalid token
  /swaps/{id}/accept:
    post:
      tags: [swaps]
      summary: Counterpart accepts; 202 and AvaliacaoPedida (purpose SWAP)
      operationId: acceptSwap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Accepted, check pending
        "409":
          description: Check failed or approval required
        "401":
          description: Missing or invalid token
  /swaps/{id}/approve:
    post:
      tags: [swaps]
      summary: Supervisor approval when the corps requires it (D-01 / RN11)
      operationId: approveSwap
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved
        "401":
          description: Missing or invalid token
        "403":
          description: Role not allowed
  /slots/{id}/presence:
    post:
      tags: [presence]
      summary: Confirm coming or cannot, 24 h before the shift
      operationId: confirmPresence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Recorded; cannot opens a cover request
        "401":
          description: Missing or invalid token
  /cover-requests/{id}/accept:
    post:
      tags: [cover]
      summary: First free and qualified accept; 202 and AvaliacaoPedida (purpose COVER)
      operationId: acceptCover
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Accepted, check pending
        "409":
          description: Slot already filled or check ineligible
        "401":
          description: Missing or invalid token
  /risk/today:
    get:
      tags: [risk]
      summary: Observed RCM for today, age, and assumed-higher display warning
      operationId: getTodayRisk
      responses:
        "200":
          description: Risk read model
        "401":
          description: Missing or invalid token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Mocked token from POST /api/v1/auth/mock-sign-in (ADR 0006): "mock." followed by the base64url of
        {"memberId": "...", "role": "..."}. It is not signed: escala-api accepts it only for an active member
        whose role in the database is the role in the token, and answers 401 otherwise. Anyone can build the
        token of a seeded user, the same exposure as the mocked sign-in itself (09, T-01).
  responses:
    Unauthorized:
      description: No token, or a token escala-api does not accept (Spring Boot error body)
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The role is not allowed (Spring Boot error body)
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: >
        Invalid fields, each with a code and never the value (SCRUM-77, SCRUM-64). A body that is not valid JSON, or a
        value outside an enum, answers 400 with Spring Boot's error body and no errors list; SCRUM-88 aligns
        the other errors with this format.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/TraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    NotFound:
      description: No member with that ID (Spring Boot error body)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: >
        Correlation id. escala-api uses the value sent, or creates a UUID when the header is absent or
        blank, and returns it in the same header on every response, errors included. It travels in
        the AvaliacaoPedida event and comes back in AvaliacaoConcluida.
      schema:
        type: string
  headers:
    TraceId:
      description: The trace id of the request (the one sent, or a generated UUID)
      schema:
        type: string
        example: d26598d5-750d-4276-b097-f629d6eef444
  schemas:
    AccessRole:
      type: string
      description: What a member may do (ADR 0006; access-control matrix on 09). Not the member's rank.
      enum: [MEMBER, SUPERVISOR, ADMIN]
    MockUser:
      type: object
      required: [id, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Synthetic Supervisor
        role:
          $ref: "#/components/schemas/AccessRole"
    MockSignInRequest:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000002
    MockSignInResponse:
      type: object
      required: [token, memberId, role, fullName]
      properties:
        token:
          type: string
          example: mock.eyJtZW1iZXJJZCI6IjAwMDAwMDAwLTAwMDAtNDAwMC04MDAwLTAwMDAwMDAwMDAwMiIsInJvbGUiOiJTVVBFUlZJU09SIn0
        memberId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AccessRole"
        fullName:
          type: string
    CreatePiqueteRequest:
      type: object
      required: [dutyDate]
      properties:
        dutyDate:
          type: string
          format: date
          example: "2026-11-01"
    PiqueteResponse:
      type: object
      required: [id, dutyDate, slots]
      properties:
        id:
          type: string
          format: uuid
        dutyDate:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotResponse"
    SlotResponse:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/SlotRole"
        status:
          $ref: "#/components/schemas/SlotStatus"
    SlotRole:
      type: string
      description: SlotRole in escala-api. A new piquete has one slot, CREW_MEMBER.
      enum: [CREW_CHIEF, DRIVER, CREW_MEMBER]
    SlotStatus:
      type: string
      description: >
        SlotStatus in escala-api. A new slot is PENDING and becomes ELIGIBLE after the evaluation. It becomes
        EVALUATION_FAILED when the evaluation could not be made or applied after the retries (RF24). A failed
        evaluation never makes a slot ELIGIBLE; an operator resolves it by replaying the dead-letter queue, and
        the ELIGIBLE result of the replayed evaluation then makes the slot ELIGIBLE.
        escala-api sets no other value yet.
      enum: [OPEN, PENDING, ELIGIBLE, PROPOSED, FILLED, EVALUATION_FAILED]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: UP or DOWN, the values seen in tests
          example: UP
    HealthWithGroups:
      allOf:
        - $ref: "#/components/schemas/Health"
        - type: object
          properties:
            groups:
              type: array
              items:
                type: string
              example: [liveness, readiness]
    Rank:
      type: string
      description: Career category; it grants no permission (see AccessRole).
      enum: [CADET, TRAINEE, FIREFIGHTER_3RD_CLASS, FIREFIGHTER_2ND_CLASS, FIREFIGHTER_1ST_CLASS, SUB_CHIEF, CHIEF, OFFICER, COMMANDER]
    RosterStatus:
      type: string
      description: Only the active roster can be scheduled (RN01, checked by the eligibility rules).
      enum: [COMMAND_ROSTER, ACTIVE_ROSTER, RESERVE_ROSTER, HONORARY_ROSTER]
    ServiceFunction:
      type: string
      description: A function a member can take on a slot (the slot roles).
      enum: [CREW_CHIEF, DRIVER, CREW_MEMBER]
    LicenceClass:
      type: string
      enum: [B, C1, C, C1E, CE]
    Licence:
      type: object
      required: [licenceClass, expiresOn]
      properties:
        licenceClass:
          $ref: "#/components/schemas/LicenceClass"
        expiresOn:
          type: string
          format: date
    CertificationRequest:
      type: object
      required: [type, issuedOn, expiresOn]
      properties:
        type:
          type: string
          description: A code from /api/v1/certification-types
          example: TAS
        issuedOn:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
          description: Not before issuedOn (code expires_before_issued)
    Certification:
      allOf:
        - $ref: "#/components/schemas/CertificationRequest"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              example: Tripulante de Ambulância de Socorro
    CertificationType:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: TAS
        name:
          type: string
          example: Tripulante de Ambulância de Socorro
    MemberDetailsRequest:
      type: object
      required: [fullName, rank, rosterStatus, withinAgeLimit, functions]
      properties:
        fullName:
          type: string
          maxLength: 120
        rank:
          $ref: "#/components/schemas/Rank"
        rosterStatus:
          $ref: "#/components/schemas/RosterStatus"
        withinAgeLimit:
          type: boolean
          description: Stored as yes or no; no date of birth (09)
        contact:
          type: string
          nullable: true
          maxLength: 120
          description: Optional. Seen only by the admin and the member themself; never logged (09).
        functions:
          type: array
          description: DRIVER needs at least one driving licence (code driver_without_licence)
          items:
            $ref: "#/components/schemas/ServiceFunction"
    QualificationsRequest:
      type: object
      required: [licences, certifications]
      properties:
        licences:
          type: array
          description: One per class (code duplicate)
          items:
            $ref: "#/components/schemas/Licence"
        certifications:
          type: array
          description: One per type (code duplicate)
          items:
            $ref: "#/components/schemas/CertificationRequest"
    MemberRequest:
      allOf:
        - $ref: "#/components/schemas/MemberDetailsRequest"
        - $ref: "#/components/schemas/QualificationsRequest"
    Member:
      type: object
      required: [id, fullName, accessRole, active, rosterStatus, withinAgeLimit, functions, licences, certifications]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        accessRole:
          $ref: "#/components/schemas/AccessRole"
        active:
          type: boolean
        rank:
          $ref: "#/components/schemas/Rank"
        rosterStatus:
          $ref: "#/components/schemas/RosterStatus"
        withinAgeLimit:
          type: boolean
        contact:
          type: string
          description: Only in answers to the admin and to the member themself; absent otherwise.
        functions:
          type: array
          items:
            $ref: "#/components/schemas/ServiceFunction"
        licences:
          type: array
          items:
            $ref: "#/components/schemas/Licence"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/Certification"
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    example: certifications[0].expiresOn
                  code:
                    type: string
                    enum: [required, too_long, expires_before_issued, unknown_certification_type, duplicate, driver_without_licence, ends_before_start, in_the_past, too_far_ahead]
    UnavailabilityRequest:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 with an offset or Z. A day without a time starts at 00:00 in Europe/Lisbon (the PWA sends it so).
          example: "2026-12-05T00:00:00Z"
        endsAt:
          type: string
          format: date-time
          description: Exclusive, after startsAt (code ends_before_start). A whole day ends at 00:00 of the next day, in Lisbon.
          example: "2026-12-08T00:00:00Z"
    Unavailability:
      type: object
      required: [id, startsAt, endsAt, source]
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: In UTC (ADR 0012)
        endsAt:
          type: string
          format: date-time
          description: In UTC, exclusive. Deleted 30 days after it (09).
        source:
          type: string
          enum: [FORM, FREE_TEXT]
    ErrorResponse:
      type: object
      description: Spring Boot's default error body
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        path:
          type: string
security:
  - bearerAuth: []
