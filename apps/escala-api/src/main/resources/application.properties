spring.application.name=escala-api
server.port=8080
# The schema is owned by the Flyway migrations in db/migration (ADR 0019); Hibernate only checks that the
# entities match it. baseline-on-migrate marks a database created before Flyway (by ddl-auto=update) as
# version 1 without running V1, so its data is kept.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.rabbitmq.template.exchange=escala.events
spring.profiles.default=ide

# SCRUM-95: a failed message goes through the broker's retry queues <queue>.retry.5s, .retry.30s and .retry.2m
# (infra/rabbitmq/definitions.json; the delay is each queue's TTL), then to <queue>.dlq.
escala.messaging.retry-stages=retry.5s,retry.30s,retry.2m
# Safety net: a rejected message is never put back in its queue, so it can never loop.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
