<main class="page">
  @if (update.available()) {
    <output class="notice">
      A new version of Escala is available.
      <button type="button" class="reload" (click)="update.reload()">Reload</button>
    </output>
  }
  @if (auth.session(); as session) {
    <nav class="menu" aria-label="Menu">
      <a routerLink="/">Schedule</a>
      <a routerLink="/unavailability">When I can't</a>
      @if (seesMembers()) {
        <a routerLink="/members">Members</a>
      }
      <span class="session">{{ session.fullName }} · {{ session.role }}</span>
      @if (canInstall()) {
        <button type="button" class="install" (click)="install()">Install Escala</button>
      }
      <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
    </nav>
    <router-outlet />
  } @else {
    <app-sign-in (signedIn)="onSignedIn()" />
  }
</main>
