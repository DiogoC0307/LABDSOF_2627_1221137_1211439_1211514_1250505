<h2 mat-dialog-title>Add shift</h2>
<mat-dialog-content>
  <div class="flex flex-col gap-5">
    <p class="text-[16px] text-[#57554F]">{{ data.day }}</p>

    <div class="grid grid-cols-2 items-start gap-3 pt-1">
      <app-time-field
        label="Start"
        example="08:30"
        [value]="startShown()"
        [options]="startOptions"
        [accept]="takeStart"
      />
      <app-time-field label="End" example="20:30" [value]="endShown()" [options]="endOptions()" [accept]="takeEnd" />
    </div>

    <fieldset class="roles-fieldset flex flex-col gap-3">
      <legend class="mb-3 p-0 text-[16px] font-bold text-[#33312D]">Roles this shift needs</legend>
      <div class="flex flex-wrap gap-2">
        @for (choice of choices(); track choice.role) {
          <button
            type="button"
            class="role-choice"
            [class.role-choice--on]="choice.chosen"
            [attr.aria-pressed]="choice.chosen"
            (click)="toggle(choice.role)"
          >
            @if (choice.chosen) {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L19 7" /></svg>
            }
            {{ choice.name }}
          </button>
        }
      </div>

      @for (role of chosen(); track role.role) {
        <div class="flex min-h-[60px] items-center justify-between gap-3 rounded-xl bg-[#F5F4F1] px-3 text-[17px]">
          <span class="font-bold text-[#1C1B19]">{{ role.name }}</span>
          <span class="flex items-center gap-2 text-[16px] text-[#33312D]">
            Needed
            <input
              #needed
              class="needed-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="2"
              autocomplete="off"
              [attr.aria-label]="role.name + ' needed'"
              [value]="role.needed"
              (input)="setNeeded(role.role, needed)"
              (blur)="showNeeded(role.role, needed)"
            />
          </span>
        </div>
      } @empty {
        <p class="text-[16px] text-[#57554F]">Choose at least one role.</p>
      }
    </fieldset>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-stroked-button type="button" class="dialog-secondary" [mat-dialog-close]="undefined">Cancel</button>
  <button mat-flat-button type="button" [disabled]="!canCreate()" (click)="create()">Create shift</button>
</mat-dialog-actions>
