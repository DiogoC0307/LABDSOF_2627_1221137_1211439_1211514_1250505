spring.application.name=elegibilidade-worker
server.port=8081
# The schema is owned by the Flyway migrations in db/migration (ADR 0019); Hibernate only checks that the
# entities match it. baseline-on-migrate marks a database created before Flyway (by ddl-auto=update) as
# version 1 without running V1, so its data is kept.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.rabbitmq.template.exchange=escala.events
spring.profiles.default=ide
