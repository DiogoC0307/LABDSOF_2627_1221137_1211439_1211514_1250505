# Profile "ide": the defaults for running this service from your IDE or with ./mvnw spring-boot:run against
#   docker compose up -d pg-escala-api pg-elegibilidade-worker rabbitmq
# It is active when no other profile is (spring.profiles.default in application.properties). Compose and Kubernetes
# set their own profile, so they never load this file, and their environment variables win anyway.
# These are the throwaway local values of compose.yaml and .env.example, never real credentials.
# If you changed a host port in .env, override it, e.g. SPRING_DATASOURCE_URL or SPRING_RABBITMQ_PORT.
spring.datasource.url=jdbc:postgresql://localhost:5433/elegibilidade
spring.datasource.username=elegibilidade
spring.datasource.password=elegibilidade_local
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=elegibilidade-worker
spring.rabbitmq.password=elegibilidade_worker_local
# The per-service RabbitMQ logins may not declare exchanges or queues (infra/rabbitmq/setup.sh);
# the topology comes from infra/rabbitmq/definitions.json. The tests set this back to true.
spring.rabbitmq.dynamic=false
