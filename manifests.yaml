apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: prod
  name: escala-prod
---
apiVersion: v1
data:
  LOGGING_LEVEL_ROOT: WARN
  SPRING_DATASOURCE_URL: jdbc:postgresql://pg-elegibilidade-worker:5432/elegibilidade
  SPRING_PROFILES_ACTIVE: prod
  SPRING_RABBITMQ_HOST: rabbitmq
kind: ConfigMap
metadata:
  name: elegibilidade-worker-config
  namespace: escala-prod
---
apiVersion: v1
data:
  LOGGING_LEVEL_ROOT: WARN
  SPRING_DATASOURCE_URL: jdbc:postgresql://pg-escala-api:5432/escala
  SPRING_PROFILES_ACTIVE: prod
  SPRING_RABBITMQ_HOST: rabbitmq
kind: ConfigMap
metadata:
  name: escala-api-config
  namespace: escala-prod
---
apiVersion: v1
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;

      # browser calls /api/... -> escala-api (prefix stripped), so no CORS is needed
      location /api/ {
        proxy_pass http://escala-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: escala-prod
---
apiVersion: v1
kind: Service
metadata:
  name: elegibilidade-worker
  namespace: escala-prod
spec:
  ports:
  - port: 8081
  selector:
    app: elegibilidade-worker
---
apiVersion: v1
kind: Service
metadata:
  name: escala-api
  namespace: escala-prod
spec:
  ports:
  - port: 8080
  selector:
    app: escala-api
---
apiVersion: v1
kind: Service
metadata:
  name: pg-elegibilidade-worker
  namespace: escala-prod
spec:
  clusterIP: None
  ports:
  - port: 5432
  selector:
    app: pg-elegibilidade-worker
---
apiVersion: v1
kind: Service
metadata:
  name: pg-escala-api
  namespace: escala-prod
spec:
  clusterIP: None
  ports:
  - port: 5432
  selector:
    app: pg-escala-api
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: escala-prod
spec:
  ports:
  - port: 5672
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: escala-prod
spec:
  ports:
  - port: 80
  selector:
    app: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elegibilidade-worker
  namespace: escala-prod
spec:
  selector:
    matchLabels:
      app: elegibilidade-worker
  template:
    metadata:
      labels:
        app: elegibilidade-worker
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: db-elegibilidade
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: db-elegibilidade
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        envFrom:
        - configMapRef:
            name: elegibilidade-worker-config
        image: ghcr.io/diogoc0307/elegibilidade-worker:0.1.0
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 60
        name: elegibilidade-worker
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
        resources:
          limits:
            memory: 640Mi
          requests:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escala-api
  namespace: escala-prod
spec:
  selector:
    matchLabels:
      app: escala-api
  template:
    metadata:
      labels:
        app: escala-api
    spec:
      containers:
      - env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: db-escala-api
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: db-escala-api
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        envFrom:
        - configMapRef:
            name: escala-api-config
        image: ghcr.io/diogoc0307/escala-api:0.1.0
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
        name: escala-api
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
        resources:
          limits:
            memory: 640Mi
          requests:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: escala-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        image: rabbitmq:4-alpine
        name: rabbitmq
        ports:
        - containerPort: 5672
        resources:
          limits:
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: escala-prod
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - image: ghcr.io/diogoc0307/escala-web:0.1.0
        name: web
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: 96Mi
          requests:
            cpu: 20m
            memory: 32Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d
          name: nginx-conf
      volumes:
      - configMap:
          name: web-nginx
        name: nginx-conf
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-elegibilidade-worker
  namespace: escala-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-elegibilidade-worker
  serviceName: pg-elegibilidade-worker
  template:
    metadata:
      labels:
        app: pg-elegibilidade-worker
    spec:
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: db-elegibilidade
        image: postgres:17-alpine
        name: postgres
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg-escala-api
  namespace: escala-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-escala-api
  serviceName: pg-escala-api
  template:
    metadata:
      labels:
        app: pg-escala-api
    spec:
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: db-escala-api
        image: postgres:17-alpine
        name: postgres
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elegibilidade-worker
  namespace: escala-prod
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elegibilidade-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: escala-api
  namespace: escala-prod
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: escala-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: escala-prod
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 4
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-elegibilidade
  namespace: escala-prod
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: db-elegibilidade
      namespace: escala-prod
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-escala-api
  namespace: escala-prod
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: db-escala-api
      namespace: escala-prod
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rabbitmq-credentials
  namespace: escala-prod
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: rabbitmq-credentials
      namespace: escala-prod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
  name: escala
  namespace: escala-prod
spec:
  rules:
  - host: escala-prod.duckdns.org
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - escala-prod.duckdns.org
    secretName: escala-tls
