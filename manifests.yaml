apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: escala-dev
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - args:
        - (sh /setup/setup.sh &); exec docker-entrypoint.sh rabbitmq-server
        command:
        - /bin/sh
        - -c
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-credentials
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-credentials
        - name: ESCALA_API_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-escala-api
        - name: ESCALA_API_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-escala-api
        - name: ELEGIBILIDADE_WORKER_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: rabbitmq-elegibilidade-worker
        - name: ELEGIBILIDADE_WORKER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: rabbitmq-elegibilidade-worker
        image: rabbitmq:4-management-alpine
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - rabbitmqctl list_queues -q name | grep -q '^worker.avaliacao-pedida$'
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 15
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        - mountPath: /setup/setup.sh
          name: config
          readOnly: true
          subPath: setup.sh
        - mountPath: /etc/rabbitmq/definitions.json
          name: config
          readOnly: true
          subPath: definitions.json
      volumes:
      - configMap:
          name: rabbitmq-config
        name: config
