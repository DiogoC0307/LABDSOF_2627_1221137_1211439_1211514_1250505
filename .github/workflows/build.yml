name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: ${{ matrix.service }} (build, test, sonarqube)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [escala-api, elegibilidade-worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarQube blame information

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/${{ matrix.service }}/pom.xml

      - name: Build
        run: chmod +x ./mvnw && ./mvnw -B -ntp package

      - name: Test (with JaCoCo coverage)
        run: ./mvnw -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-reports
          path: |
            apps/${{ matrix.service }}/target/surefire-reports/
            apps/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: ignore

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.projectKey=DiogoC0307_LABDSOF_2627_1221137_1211439_1211514_1250505

  web:
    name: web (build, test, sonarqube)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:ci

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports
          path: apps/web/coverage/
          if-no-files-found: ignore

      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: apps/web
          args: >
            -Dsonar.projectKey=DiogoC0307_LABDSOF_2627_1221137_1211439_1211514_1250505
            -Dsonar.organization=diogoc0307

  security:
    name: security (secrets, dependencies, sbom)
    runs-on: ubuntu-latest
    # Non-blocking for now: nothing in this job may fail the build until we have seen the first results.
    # Every step below also has continue-on-error, so a failed download shows as a red step, not a red build.
    continue-on-error: true
    env:
      GITLEAKS_VERSION: '8.30.1'
      OSV_SCANNER_VERSION: '2.7.0'
      CYCLONEDX_MAVEN_VERSION: '2.9.3'
      CYCLONEDX_NPM_VERSION: '6.0.1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Prepare reports folder
        run: mkdir -p reports

      - name: Secrets (gitleaks, history of the checked-out commit)
        continue-on-error: true
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" gitleaks_checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          # --redact keeps secret values out of the report and the logs.
          # --log-opts="HEAD" scans only the history of the checked-out commit, not every ref: the generated
          # deploy/* branches hold rendered manifests (image tags, Sealed Secrets) that are not source history.
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --log-opts="HEAD" \
            --report-format json --report-path reports/gitleaks.json --exit-code 0

      - name: npm audit (apps/web)
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm audit --omit=dev --audit-level=high --json > ../../reports/npm-audit-prod.json || true
          npm audit --audit-level=high --json > ../../reports/npm-audit-all.json || true

      - name: SBOM (Maven, CycloneDX)
        continue-on-error: true
        run: |
          for service in escala-api elegibilidade-worker; do
            if (cd "apps/$service" && chmod +x ./mvnw && \
                ./mvnw -B -ntp "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_MAVEN_VERSION}:makeAggregateBom"); then
              cp "apps/$service/target/bom.json" "reports/sbom-$service.cdx.json"
            else
              echo "::warning::SBOM generation failed for $service"
            fi
          done

      - name: SBOM (web, CycloneDX)
        continue-on-error: true
        working-directory: apps/web
        run: |
          npm ci --omit=dev --ignore-scripts
          npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" --omit dev --output-file ../../reports/sbom-web.cdx.json

      # The Maven poms inherit versions from spring-boot-starter-parent, so OSV-Scanner cannot evaluate them
      # directly (it filtered all 24 packages as unscannable when we tried). It reads the resolved dependency
      # tree from the CycloneDX files instead, which gives the same Maven coordinates and versions.
      - name: Vulnerabilities (OSV-Scanner)
        continue-on-error: true
        run: |
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "$base/osv-scanner_linux_amd64"
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner_SHA256SUMS" "$base/osv-scanner_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " osv-scanner_linux_amd64\$" osv-scanner_SHA256SUMS | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum -c -)
          chmod +x "$RUNNER_TEMP/osv-scanner"
          args=(-L apps/web/package-lock.json)
          for sbom in reports/sbom-escala-api.cdx.json reports/sbom-elegibilidade-worker.cdx.json; do
            [ -f "$sbom" ] && args+=(-L "$sbom")
          done
          # exit code 1 means "vulnerabilities found", which is a result here and not an error
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" --format json --output-file reports/osv.json || true

      - name: Summary
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/security-summary.py reports | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: reports/sbom-*.cdx.json
          if-no-files-found: ignore

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            reports/gitleaks.json
            reports/npm-audit-prod.json
            reports/npm-audit-all.json
            reports/osv.json
          if-no-files-found: ignore
