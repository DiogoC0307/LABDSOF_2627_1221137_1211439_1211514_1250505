# QA: every push to a release/X.Y.Z branch (git flow) builds a release candidate and publishes its manifests to deploy/qa.
name: Deploy QA
on:
  push:
    branches: ['release/**']

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rc_tag: ${{ steps.v.outputs.rc_tag }}
    steps:
      - id: v
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH#release/}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branches must be named release/MAJOR.MINOR.PATCH (got '$BRANCH')"; exit 1
          fi
          echo "rc_tag=${VERSION}-rc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/build-images.yml
    with:
      version_tag: ${{ needs.prepare.outputs.rc_tag }}

  deploy:
    needs: [prepare, build]
    permissions: { contents: write }
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      overlay: qa
      tag: ${{ needs.prepare.outputs.rc_tag }}
