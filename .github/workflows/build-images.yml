# Reusable: builds the 3 images and pushes them to GHCR.
# Every build is tagged with the commit SHA (immutable). Optional extra tags below.
name: Build images
on:
  workflow_call:
    inputs:
      version_tag:
        type: string
        default: ''
        description: 'Extra tag, e.g. 1.2.0-rc.7 (optional)'
      tag_latest:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: escala-api,           path: apps/escala-api }
          - { image: elegibilidade-worker, path: apps/elegibilidade-worker }
          - { image: escala-web,           path: apps/web }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner (GHCR requires it)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ inputs.version_tag != '' && format('ghcr.io/{0}/{1}:{2}', env.OWNER, matrix.image, inputs.version_tag) || '' }}
            ${{ inputs.tag_latest && format('ghcr.io/{0}/{1}:latest', env.OWNER, matrix.image) || '' }}
